name: Worker syntax check

on:
  push:
    branches:
      - main
      - feature/dual-video-generator
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker and Node backend syntax
        run: |
          node --check src/index.js
          node --check server.js
