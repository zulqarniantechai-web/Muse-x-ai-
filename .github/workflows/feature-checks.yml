name: MUSE-X AI Feature Checks

on:
  push:
    branches:
      - feature/zero-cost-script-writer
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run zero-dependency feature checks
        run: npm test
