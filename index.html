<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROJECT MUSE-X</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font-family:Arial,sans-serif}
header{background:#102744;color:white;padding:22px}header h1{margin:0;font-size:22px}header p{margin:7px 0 0;color:#cbd8e8}
main{max-width:900px;margin:24px auto;padding:0 14px}.card{background:white;border:1px solid #dce3ed;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px #12243a0a}
label{display:block;font-weight:bold;margin:12px 0 8px}textarea,input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}
textarea{min-height:220px;resize:vertical}button{border:0;border-radius:9px;background:#1764b1;color:white;padding:12px 18px;font-weight:bold;margin:12px 8px 0 0;cursor:pointer}
button.secondary{background:#42566f}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fa;padding:14px;border-radius:9px;min-height:80px}
small{color:#5b6878}.status{font-weight:bold;color:#145c37}
</style></head>
<body>
<header><h1>PROJECT MUSE-X — Dashboard</h1><p>AI Script Analyzer Control Panel · Version 2.0</p></header>
<main>
<section class="card">
<h2>اسکرپٹ تجزیہ</h2>
<label for="endpoint">Backend URL</label><input id="endpoint" placeholder="مثلاً https://your-service.onrender.com">
<label for="script">اپنی مکمل اسکرپٹ یہاں پیسٹ کریں</label>
<textarea id="script" placeholder="یہاں اپنی کہانی یا ویڈیو اسکرپٹ پیسٹ کریں..."></textarea>
<button id="run">پروجیکٹ شروع کریں</button>
<button class="secondary" id="download">اسکرپٹ ڈاؤن لوڈ کریں</button>
<p id="status" class="status" aria-live="polite"></p>
</section>
<section class="card"><h2>AI Production Plan</h2><pre id="result">تجزیے کا نتیجہ یہاں ظاہر ہوگا۔</pre><button id="save" class="secondary">نتیجہ JSON ڈاؤن لوڈ کریں</button></section>
<section class="card"><small>اہم: AI تجزیے کے لیے الگ Backend deploy کرنا اور اس کے Environment Variables میں OPENAI_API_KEY محفوظ کرنا ضروری ہے۔ API key اس HTML فائل میں ہرگز نہ ڈالیں۔</small></section>
</main>
<script>
let lastResult=null;
const $=id=>document.getElementById(id);
$('run').onclick=async()=>{
 const script=$('script').value.trim(), endpoint=$('endpoint').value.trim().replace(/\/$/,'');
 if(!script){$('status').textContent='پہلے اسکرپٹ پیسٹ کریں۔';return}
 if(!endpoint){$('status').textContent='پہلے Backend URL درج کریں۔';return}
 $('status').textContent='AI تجزیہ جاری ہے...';
 try{
  const r=await fetch(endpoint+'/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({script})});
  const data=await r.json();if(!r.ok)throw new Error(data.error||'Backend error');
  lastResult=data;$('result').textContent=JSON.stringify(data,null,2);$('status').textContent='تجزیہ مکمل ہوگیا۔';
 }catch(e){$('status').textContent='خرابی: '+e.message+' — Backend URL اور deployment چیک کریں۔'}
};
$('download').onclick=()=>{const b=new Blob([$('script').value],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='musex-script.txt';a.click();URL.revokeObjectURL(a.href)};
$('save').onclick=()=>{if(!lastResult){$('status').textContent='ابھی کوئی AI نتیجہ موجود نہیں۔';return}const b=new Blob([JSON.stringify(lastResult,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='musex-production-plan.json';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
