<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUSE-X AI</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font-family:Arial,sans-serif}header{background:#102744;color:white;padding:24px;text-align:center}main{max-width:760px;margin:28px auto;padding:0 16px}.card{background:white;border:1px solid #dce3ed;border-radius:16px;padding:22px}label{display:block;font-weight:bold;margin-bottom:10px}textarea{width:100%;min-height:260px;padding:15px;border:1px solid #cbd5e1;border-radius:12px;font:16px/1.7 Arial;direction:auto}button,#download{display:block;width:100%;border:0;border-radius:11px;background:#1764b1;color:white;padding:15px;margin-top:16px;font-size:17px;font-weight:bold;text-align:center;text-decoration:none}button:disabled{opacity:.55}.status{white-space:pre-wrap;line-height:1.7;color:#24543b}video{display:none;width:100%;margin-top:18px;border-radius:12px}small{display:block;color:#667487;line-height:1.6;margin-top:14px}</style></head><body><header><h1>MUSE-X AI</h1><p>اپنی اسکرپٹ سے خودکار ویڈیو بنائیں</p></header><main><section class="card"><label for="script">اپنی مکمل اسکرپٹ یہاں پیسٹ کریں</label><textarea id="script" placeholder="یہاں اپنی کہانی یا ویڈیو اسکرپٹ پیسٹ کریں..."></textarea><button id="generate">اسکرپٹ انٹر کریں اور ویڈیو بنائیں</button><p id="status" class="status" aria-live="polite"></p><video id="preview" controls playsinline></video><a id="download" download="musex-video.mp4" style="display:none">ویڈیو ڈاؤن لوڈ کریں</a><small>مفت عوامی AI GPU استعمال ہوگا۔ قطار، روزانہ کی حد اور عارضی عدم دستیابی ممکن ہے۔ کوئی Paid API یا خودکار ادائیگی نہیں۔ ویڈیو مختصر کلپ ہوگی؛ 5 GPU منٹ کا مطلب 5 منٹ کی تیار ویڈیو نہیں ہے۔</small></section></main><script>const $=id=>document.getElementById(id);let objectUrl=null;$('generate').onclick=async()=>{const script=$('script').value.trim(),button=$('generate'),status=$('status');if(!script){status.textContent='پہلے اسکرپٹ پیسٹ کریں۔';return}if(script.length>12000){status.textContent='اسکرپٹ 12,000 حروف سے کم رکھیں۔';return}button.disabled=true;$('download').style.display='none';$('preview').style.display='none';if(objectUrl)URL.revokeObjectURL(objectUrl);status.textContent='AI اسکرپٹ سمجھ کر ویڈیو بنا رہا ہے۔ GPU قطار کی وجہ سے انتظار ہو سکتا ہے...';try{const r=await fetch('https://muse-x-ai.zulqarniantechai.workers.dev/produce',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({script})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'ویڈیو تیار نہیں ہوئی۔');const vr=await fetch(d.video_url);if(!vr.ok){const detail=await vr.text();let message=detail;try{const parsed=JSON.parse(detail);message=parsed.error||detail}catch{}throw Error('ویڈیو ڈاؤن لوڈ ناکام (HTTP '+vr.status+'): '+String(message).slice(0,500))}const videoBlob=await vr.blob();if(!videoBlob.size)throw Error('سرور نے خالی ویڈیو فائل بھیجی۔');if(!videoBlob.type.startsWith('video/')&&videoBlob.type!=='application/octet-stream')throw Error('سرور نے ویڈیو کے بجائے '+(videoBlob.type||'نامعلوم فائل')+' بھیجی۔');objectUrl=URL.createObjectURL(videoBlob);$('preview').src=objectUrl;$('preview').style.display='block';$('download').href=objectUrl;$('download').style.display='block';status.textContent='ویڈیو تیار ہوگئی! نیچے ڈاؤن لوڈ کریں۔'}catch(e){status.textContent='خرابی: '+e.message+'\nمفت GPU مصروف یا عارضی طور پر بند ہو سکتا ہے۔ کچھ دیر بعد کوشش کریں۔'}finally{button.disabled=false}};</script></body></html>
